[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alicloud-shared-runtime"
version = "0.1.0"
description = "Shared runtime for alicloud-skills (chat context, subprocess utils)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["alicloud_shared*"]